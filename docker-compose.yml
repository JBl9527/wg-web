services:
  wireguard-webui:
    build: .
    container_name: wireguard-webui
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "8000:8000"
      - "51820:51820/udp"
    volumes:
      - ./data:/app/data
      - /etc/wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    environment:
      - WEBUI_PORT=8000
      - WEBUI_HOST=0.0.0.0
      - WG_DEFAULT_PORT=51820
